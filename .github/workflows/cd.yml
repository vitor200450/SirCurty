name: CD

# ArgoCD tracks `develop` (k8s/argocd/application.yaml): every merge builds the
# images, pushes them to GHCR and bumps the tags in the dev overlay (GitOps trigger).
on:
  push:
    branches: [develop]
    paths-ignore:
      - "k8s/**"
      - "docs/**"
      - "**.md"

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/vitor200450/sircurty-api
  FRONTEND_IMAGE: ghcr.io/vitor200450/sircurty-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  bump-manifests:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - name: Set image tags in the dev overlay
        working-directory: k8s/overlays/dev
        run: |
          kustomize edit set image \
            "${API_IMAGE}=${API_IMAGE}:${GITHUB_SHA}" \
            "${FRONTEND_IMAGE}=${FRONTEND_IMAGE}:${GITHUB_SHA}"
      - name: Commit and push
        run: |
          if git diff --quiet; then
            echo "No manifest changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump image tags to ${GITHUB_SHA::7}"
          git pull --rebase origin develop
          git push origin develop
