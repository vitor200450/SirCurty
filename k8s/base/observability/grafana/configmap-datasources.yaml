apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
  labels:
    app: grafana
    app.kubernetes.io/part-of: sircurty-observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo.observability.svc.cluster.local:3200
        isDefault: true
        editable: false
        jsonData:
          httpMethod: GET
          tracesToLogsV2:
            datasourceUid: ""
          nodeGraph:
            enabled: true
          traceQuery:
            timeShiftEnabled: true
            spanStartTimeShift: "-1h"
            spanEndTimeShift: "1h"
          spanBar:
            type: "None"
          search:
            hide: false
          lokiSearch:
            datasourceUid: ""
