apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: observability
  labels:
    app: grafana
    app.kubernetes.io/part-of: sircurty-observability
binaryData: {}
# Dashboard JSON files are mounted via kustomize configMapGenerator (see kustomization.yaml).
# This ConfigMap is a placeholder; the actual content is generated by:
#
#   configMapGenerator:
