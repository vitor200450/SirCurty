apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sircurty

# secret.example.yaml is intentionally NOT listed: the real Secret is created
# out-of-band (never committed). See k8s/README.md.
resources:
  - namespace.yaml
  - config/configmap.yaml
  - postgres/service.yaml
  - postgres/statefulset.yaml
  - api/service.yaml
  - api/deployment.yaml
  - frontend/service.yaml
  - frontend/deployment.yaml
  - ingress/ingress.yaml
