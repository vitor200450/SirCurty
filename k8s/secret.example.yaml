# EXAMPLE ONLY — not part of the Helm chart and must never hold real values.
# Create the real Secret in the cluster (see k8s/README.md):
#
#   kubectl -n sircurty create secret generic sircurty-secrets \
#     --from-literal=POSTGRES_PASSWORD='<password>' \
#     --from-literal=DATABASE_URL='postgresql://sircurty:<password>@postgres:5432/sircurty?schema=public' \
#     --from-literal=JWT_SECRET='<random-string>'
apiVersion: v1
kind: Secret
metadata:
  name: sircurty-secrets
  namespace: sircurty
type: Opaque
stringData:
  POSTGRES_PASSWORD: change-me
  DATABASE_URL: postgresql://sircurty:change-me@postgres:5432/sircurty?schema=public
  JWT_SECRET: change-me
