apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Pulls in the observability stack.
# The app base (frontend/api/postgres) will be added here
# by the infrastructure team when k8s/base/app/ is ready.
resources:
  - ../../base/observability

# Common labels applied to every resource in this overlay
commonLabels:
  environment: dev

# Patch: single replica for everything in dev (saves Docker Desktop resources)
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: otel-collector
        namespace: observability
      spec:
        replicas: 1
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: tempo
        namespace: observability
      spec:
        replicas: 1
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: grafana
        namespace: observability
      spec:
        replicas: 1
