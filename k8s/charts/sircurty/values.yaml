# Single environment (dev, Docker Desktop). The CD pipeline bumps the two image tags below.
environment: dev
ingressClassName: nginx

hosts:
  app: sircurty.local
  grafana: grafana.sircurty.local
  otel: otel.sircurty.local

google:
  # OAuth Client ID from Google Cloud Console (public value). The API refuses to start if empty.
  clientId: "change-me.apps.googleusercontent.com"

api:
  replicas: 1
  image:
    repository: ghcr.io/vitor200450/sircurty-api
    tag: latest

frontend:
  replicas: 1
  image:
    repository: ghcr.io/vitor200450/sircurty-frontend
    tag: latest
