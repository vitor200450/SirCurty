apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: sircurty
  labels:
    app: api
    app.kubernetes.io/part-of: sircurty
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 3000
      targetPort: http
