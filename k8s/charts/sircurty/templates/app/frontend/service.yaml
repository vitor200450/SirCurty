apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: sircurty
  labels:
    app: frontend
    app.kubernetes.io/part-of: sircurty
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
