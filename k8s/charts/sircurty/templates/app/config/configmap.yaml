apiVersion: v1
kind: ConfigMap
metadata:
  name: sircurty-config
  namespace: sircurty
  labels:
    app.kubernetes.io/part-of: sircurty
data:
  # Frontend runtime config (rendered into /env-config.js by docker-entrypoint.sh)
  API_URL: "/api"
  APP_ENV: "{{ .Values.environment }}"
  APP_BASE_URL: "http://{{ .Values.hosts.app }}"
  OTEL_ENDPOINT: "http://{{ .Values.hosts.otel }}"

  # API runtime config
  NODE_ENV: "production"
  PORT: "3000"
  # Same-origin through the ingress, but CORS must still accept the public origin
  ALLOWED_ORIGINS: "http://{{ .Values.hosts.app }}"
  # One hop (ingress-nginx) in front of the API: real client IP for throttling/click stats
  TRUST_PROXY: "1"
  # Where API-side redirects (/s/:code fallbacks) send the browser
  FRONTEND_BASE_URL: "http://{{ .Values.hosts.app }}"
  OTEL_SERVICE_NAME: "sircurty-api"
  OTEL_DEPLOYMENT_ENV: "{{ .Values.environment }}"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.observability.svc.cluster.local:4317"

  # Postgres (non-sensitive part; the password lives in the sircurty-secrets Secret)
  POSTGRES_DB: "sircurty"
  POSTGRES_USER: "sircurty"
