apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: sircurty
  labels:
    app: postgres
    app.kubernetes.io/part-of: sircurty
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  clusterIP: None   # headless: required by the StatefulSet, resolves to the pod IP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
