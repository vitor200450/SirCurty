apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sircurty
  namespace: sircurty
  labels:
    app.kubernetes.io/part-of: sircurty
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  ingressClassName: {{ .Values.ingressClassName }}
  rules:
    {{- range list .Values.hosts.app .Values.hosts.appAlias }}
    - host: {{ . }}
      http:
        paths:
          # API (no rewrite: the API serves under the /api prefix)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3000
          # SPA, including /s/:code (interstitial must be resolved by the frontend,
          # so the ingress must not send it to the API)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    {{- end }}
