apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: observability
data:
  tempo.yaml: |
    stream_over_http_enabled: true

    server:
      http_listen_port: 3200
      log_level: info

    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: "0.0.0.0:4317"
            http:
              endpoint: "0.0.0.0:4318"

    ingester:
      trace_idle_period: 10s
      max_block_bytes: 1_000_000
      max_block_duration: 5m

    compactor:
      compaction:
        compaction_window: 1h
        max_block_bytes: 100_000_000
        block_retention: 48h          # keep traces for 48h (enough for hackathon)
        compacted_block_retention: 10m

    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal

    query_frontend:
      search:
        duration_slo: 5s
        throughput_bytes_slo: 1.073741824e+09
      trace_by_id:
        duration_slo: 5s

    # Generates span metrics consumed by the Grafana dashboards and by the
    # TraceQL queries that aggregate by service, span name or link attribute.
    # service-graphs additionally powers the Grafana Service Graph panel.
    metrics_generator:
      storage:
        path: /var/tempo/generator/wal
        remote_write:
          - url: http://prometheus.observability.svc.cluster.local:9090/api/v1/write
            remote_timeout: 10s
      processor:
        service_graphs:
          wait: 10s
          max_items: 10000
        span_metrics:
          # service, span_name and status_code are intrinsic labels already;
          # repeating them here makes Tempo drop the service label.
          dimensions:
            - link.code
            - link.target_domain

    overrides:
      defaults:
        metrics_generator:
          processors: [service-graphs, span-metrics]
